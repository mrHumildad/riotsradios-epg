name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Python syntax
        run: python3 -m py_compile scripts/find_epg_urls.py scripts/fetch_epgs.py

      - name: Unit tests
        run: npm test

      - name: Validate guides
        run: npm run validate

      # catalog/stations.csv is the file every listener renders: the app adopts a
      # published catalog at runtime, so this gate is the only thing between an
      # edit and the player.
      - name: Validate catalog
        run: npm run validate:catalog

      - name: Build the published catalog
        run: npm run catalog

      - name: Manifest is current
        run: npm run manifest -- --check
