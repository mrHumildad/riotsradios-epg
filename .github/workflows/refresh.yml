name: Refresh EPG

on:
  schedule:
    # Daily, after the stream-health probe. GitHub cron is UTC.
    - cron: '37 4 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Optional space-separated station ids'
        required: false
      force:
        description: 'Ignore ETag and Last-Modified'
        type: boolean
        default: false
      render:
        description: 'Render JavaScript pages with Playwright'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: epg-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # catalog/stations.csv is the app-facing catalog; the pipeline config only
      # gains a disabled row per new station, then discovery starts below.
      - name: Sync new stations from the catalog
        id: sync
        run: node scripts/sync-app-stations.mjs --app-file catalog/stations.csv --write

      - name: Validate the catalog
        run: npm run validate:catalog

      - name: Install optional renderer
        if: ${{ inputs.render == true }}
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium

      - name: Restore raw snapshots
        uses: actions/cache@v4
        with:
          path: data/raw
          key: epg-raw-${{ github.run_id }}
          restore-keys: |
            epg-raw-

      - name: Discover sources for new stations
        if: steps.sync.outputs.added != ''
        env:
          ADDED: ${{ steps.sync.outputs.added }}
        run: python3 scripts/find_epg_urls.py --resume --write --only $ADDED

      - name: Fetch sources
        env:
          ONLY: ${{ inputs.only }}
          ADDED: ${{ steps.sync.outputs.added }}
          FORCE: ${{ inputs.force }}
          RENDER: ${{ inputs.render }}
        run: |
          EXTRA=()
          if [ -n "$ONLY" ]; then
            read -r -a IDS <<< "$ONLY"
            if [ -n "$ADDED" ]; then
              read -r -a NEW <<< "$ADDED"
              IDS+=("${NEW[@]}")
            fi
            EXTRA+=(--only "${IDS[@]}")
          fi
          if [ "$FORCE" = "true" ]; then
            EXTRA+=(--force)
          fi
          if [ "$RENDER" = "true" ]; then
            EXTRA+=(--render)
          fi
          python3 scripts/fetch_epgs.py --max-age-hours 20 "${EXTRA[@]}"

      - name: Install poppler (PDF text layer)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Convert snapshots
        env:
          OCR_SPACE_API_KEY: ${{ secrets.OCR_SPACE_API_KEY }}
        run: node scripts/convert-raw-epg.mjs

      # Radio Pica's grid folds the week into five-hour cycles, which the generic
      # table strategy mis-pairs. Its guide is owned by a dedicated scraper;
      # convert-raw-epg.mjs skips the id. A failed scrape keeps the last guide.
      - name: Scrape dedicated sources
        continue-on-error: true
        run: npm run scrape:radiopica

      - name: Apply guides for new stations
        if: steps.sync.outputs.added != ''
        env:
          ADDED: ${{ steps.sync.outputs.added }}
        run: node scripts/apply-epg-report.mjs --only $ADDED

      - name: Validate guides
        run: node scripts/validate-epgs.js

      - name: Build manifest
        run: node scripts/build-manifest.mjs

      - name: Build the published catalog
        run: npm run catalog

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epg-report
          path: |
            data/epg-report.json
            data/raw/_run.json
          if-no-files-found: warn

      - name: Commit refreshed guides
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/stations.csv data/epg_sources.json public/EPGs data/epg-report.json
          if git diff --cached --quiet; then
            echo "EPG output unchanged"
            exit 0
          fi
          git commit -m "chore(epg): sync app stations and refresh guides"
          git push

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true
          enable_jekyll: false
